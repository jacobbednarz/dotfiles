[dotfiles]
"~/.config/fish/config.fish" = { source = ".config/fish/config.fish", mode = "symlink" }
"~/.config/ghostty" = { source = ".config/ghostty", mode = "symlink-each" }
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml", mode = "symlink" }
"~/.config/nvim" = { source = ".config/nvim", mode = "symlink-each" }
"~/.config/zed/settings.json" = { source = ".config/zed/settings.json", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.gitconfig-personal" = { source = ".gitconfig-personal", mode = "symlink" }
"~/.gnupg/gpg-agent.conf" = { source = ".gnupg/gpg-agent.conf", mode = "symlink" }
